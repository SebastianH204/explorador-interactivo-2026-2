<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéKit - Taller semana 8</title>
    <meta name="description" content="Explorador de Pokémon con datos reales de la PokéAPI y favoritos guardados.">
    <link rel="stylesheet" href="css/tailwind.css">
</head>

<body class="bg-slate-100 text-slate-900 dark:bg-slate-900 dark:text-slate-100">

    <header class="sticky top-0 z-10 bg-white shadow dark:bg-slate-900">
        <nav class="relative mx-auto flex max-w-6xl items-center justify-between p-4">
            <a href="#" class="text-xl font-bold text-indigo-600">
                Poké<span class="text-slate-900 dark:text-white">Kit</span>
            </a>

            <button id="btn-menu" type="button"
                class="rounded-lg p-2 text-2xl hover:bg-slate-100 md:hidden dark:hover:bg-slate-700"
                aria-label="Abrir menú" aria-controls="menu" aria-expanded="false">☰</button>

            <ul id="menu"
                class="absolute top-full right-0 left-0 hidden flex-col gap-1 bg-white p-4 shadow-lg
                       md:static md:flex md:flex-row md:gap-6 md:bg-transparent md:p-0 md:shadow-none
                       dark:bg-slate-900">
                <li><a href="#" data-vista="todos" aria-current="page" class="block rounded-lg px-3 py-2 font-medium text-indigo-600 md:p-0 md:hover:bg-transparent dark:text-indigo-400">Pokémon</a></li>
                <li><a href="#" class="block rounded-lg px-3 py-2 hover:bg-slate-100 md:p-0 md:hover:bg-transparent md:hover:text-indigo-600 dark:hover:bg-slate-700">Tipos</a></li>
                <li><a href="#" data-vista="favoritos" class="block rounded-lg px-3 py-2 hover:bg-slate-100 md:p-0 md:hover:bg-transparent md:hover:text-indigo-600 dark:hover:bg-slate-700">Favoritos</a></li>
            </ul>
        </nav>
    </header>

    <h1 id="titulo" class="mx-auto mt-6 max-w-3xl px-4 text-3xl font-bold">Pokémon</h1>

    <form id="form-busqueda" class="mx-auto flex max-w-3xl flex-col gap-3 p-4 md:flex-row" role="search">
        <label for="busqueda" class="sr-only">Buscar Pokémon</label>
        <input id="busqueda" name="busqueda" type="search" placeholder="Buscar por nombre…" minlength="2"
            class="flex-1 rounded-lg border border-slate-300 bg-white px-3 py-2 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 focus:outline-none dark:border-slate-600 dark:bg-slate-800 user-invalid:border-rose-500">

        <label for="filtro-tipo" class="sr-only">Filtrar por tipo</label>
        <select id="filtro-tipo" name="tipo" class="rounded-lg border border-slate-300 bg-white px-3 py-2 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 focus:outline-none dark:border-slate-600 dark:bg-slate-800">
            <option value="">Todos los tipos</option>
            <option value="normal">Normal</option>
            <option value="fire">Fuego</option>
            <option value="water">Agua</option>
            <option value="grass">Planta</option>
            <option value="electric">Eléctrico</option>
            <option value="ice">Hielo</option>
            <option value="fighting">Lucha</option>
            <option value="poison">Veneno</option>
            <option value="ground">Tierra</option>
            <option value="flying">Volador</option>
            <option value="psychic">Psíquico</option>
            <option value="bug">Bicho</option>
            <option value="rock">Roca</option>
            <option value="ghost">Fantasma</option>
            <option value="dragon">Dragón</option>
            <option value="dark">Siniestro</option>
            <option value="steel">Acero</option>
            <option value="fairy">Hada</option>
        </select>

        <button type="submit"
            class="rounded-lg bg-indigo-600 px-5 py-2 font-semibold text-white transition
                   hover:bg-indigo-700 active:scale-95
                   disabled:cursor-not-allowed disabled:bg-slate-300">
            Buscar
        </button>
    </form>

    <main class="mx-auto max-w-6xl px-4">
        <p id="contador" class="text-sm text-slate-500 dark:text-slate-400"></p>
        <section id="grilla" class="mt-3 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4" aria-label="Resultados"></section>
        <div class="mt-8 text-center">
            <button id="btn-mas" type="button" hidden
                class="rounded-lg border border-slate-300 bg-white px-6 py-2 font-semibold transition
                       hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-50
                       dark:border-slate-600 dark:bg-slate-800 dark:hover:bg-slate-700">
                Cargar más
            </button>
        </div>
    </main>

    <dialog id="modal-detalle" aria-labelledby="modal-nombre"
        class="m-auto w-full max-w-md overflow-hidden rounded-2xl bg-white p-0 text-slate-900 shadow-2xl
               backdrop:bg-slate-900/60 backdrop:backdrop-blur-sm
               dark:bg-slate-800 dark:text-white">
        <img id="modal-img" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png" alt="Pikachu"
            class="aspect-square w-full bg-slate-100 object-contain p-6 dark:bg-slate-700">
        <div class="space-y-4 p-6">
            <h2 id="modal-nombre" class="text-2xl font-bold capitalize">Pikachu</h2>
            <dl class="grid grid-cols-2 gap-x-4 gap-y-2 text-sm">
                <dt class="text-slate-500 dark:text-slate-400">Número</dt>
                <dd id="modal-numero" class="font-medium">#025</dd>
                <dt class="text-slate-500 dark:text-slate-400">Tipo</dt>
                <dd id="modal-tipo" class="font-medium">Eléctrico</dd>
                <dt class="text-slate-500 dark:text-slate-400">Altura</dt>
                <dd id="modal-altura" class="font-medium">0.4 m</dd>
                <dt class="text-slate-500 dark:text-slate-400">Peso</dt>
                <dd id="modal-peso" class="font-medium">6 kg</dd>
                <dt class="text-slate-500 dark:text-slate-400">Habilidades</dt>
                <dd id="modal-habilidades" class="font-medium capitalize">Static, Lightning Rod</dd>
            </dl>
            <form method="dialog">
                <button class="w-full rounded-lg border border-slate-300 py-2 font-semibold hover:bg-slate-100
                               dark:border-slate-600 dark:hover:bg-slate-700">
                    Cerrar
                </button>
            </form>
        </div>
    </dialog>

    <footer class="py-6 text-center text-sm text-slate-500 dark:text-slate-400">
        Datos de <a href="https://pokeapi.co" target="_blank" class="font-semibold text-indigo-600 hover:underline dark:text-indigo-400">PokéAPI</a>
    </footer>

    <script type="module" src="js/app.js"></script>

</body>

</html>
